<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leeuwie, professor de neerlandês | Wordly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4EA; --card:#FFFFFF; --ink:#3A2418; --muted:#8A6E5C;
  --red:#E8711F; --yellow:#F2B42C; --brown:#21468B; --cream:#FCDE9C;
  --line:#F0DFC4; --green:#3E9B5B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 140px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-family:Fredoka,sans-serif;font-size:26px;margin:0;letter-spacing:.2px}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--muted);font-family:Nunito,sans-serif}
.flag{width:34px;height:22px;border-radius:5px;background:linear-gradient(#AE1C28 0 33.3%,#fff 33.3% 66.6%,#21468B 66.6%);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.stage{position:relative;border-radius:26px;overflow:hidden;background:#cfe6f3;box-shadow:0 10px 30px rgba(120,70,30,.15)}
.stage svg{display:block;width:100%;height:auto}
#head{transform-origin:560px 1200px;animation:breathe 4s ease-in-out infinite}
.talking #head{animation:bob .45s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.008) translateY(-3px)}}
@keyframes bob{50%{transform:rotate(-.8deg) translateY(-4px)}}
.status{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center}
.speed{position:absolute;right:12px;top:12px;border:none;background:rgba(255,255,255,.92);border-radius:999px;padding:7px 12px;font:700 13px Nunito,sans-serif;color:var(--ink);cursor:pointer}
.dot{width:9px;height:9px;border-radius:50%;background:#bbb}
.st-listen .dot{background:var(--red);animation:pulse 1s infinite}
.st-think .dot{background:var(--yellow);animation:pulse .6s infinite}
.st-talk .dot{background:var(--green)}
@keyframes pulse{50%{opacity:.25}}
.bubble{background:var(--card);border-radius:20px;padding:14px 16px;margin-top:14px;box-shadow:0 4px 14px rgba(120,70,30,.08);border:1px solid var(--line)}
.bubble .es{font-family:Fredoka,sans-serif;font-size:20px;font-weight:500;line-height:1.35}
.bubble .pt{color:var(--muted);margin-top:6px;font-size:15px}
.tip{margin-top:10px;background:#FFF3D6;border-left:4px solid var(--yellow);border-radius:10px;padding:8px 10px;font-size:15px}
.tip b{color:var(--brown)}
.me{background:#FDE9D8;border-color:#F7D2B3;text-align:right}
.me .es{font-size:17px}
.log{margin-top:6px}
.hidden{display:none!important}
.controls{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 16px 16px}
.controls .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.mic{flex:none;width:72px;height:72px;border-radius:50%;border:none;background:var(--red);color:#fff;font-family:Fredoka;font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 6px 18px rgba(232,113,31,.4)}
.mic:disabled{opacity:.45;cursor:not-allowed}
.mic.on{background:var(--ink);animation:pulse 1.2s infinite}
.mic svg{width:28px;height:28px;display:block;margin:0 auto 2px}
.typing{flex:1;display:flex;background:#fff;border-radius:999px;border:1px solid var(--line);overflow:hidden}
.typing input{flex:1;border:none;padding:14px 16px;font:inherit;font-size:16px;outline:none;background:transparent;min-width:0}
.typing button{border:none;background:var(--yellow);color:var(--ink);font-weight:700;padding:0 16px;cursor:pointer}
.panel{background:var(--card);border-radius:20px;padding:16px;margin-top:14px;border:1px solid var(--line)}
.panel h2{font-family:Fredoka;font-size:18px;margin:0 0 10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin:10px 0 4px}
select{width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);font:inherit;background:#FFFBF3}
.big{width:100%;margin-top:14px;padding:15px;border:none;border-radius:14px;background:var(--red);color:#fff;font-family:Fredoka;font-size:18px;font-weight:600;cursor:pointer}
.big:disabled{opacity:.5}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--red));transition:width .3s}
.small{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}
.warn{background:#FDE7E2;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.toast{position:fixed;left:16px;right:16px;bottom:104px;max-width:528px;margin:0 auto;background:#3A2418;color:#fff;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:5}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}

/* Layout de tela única: professor sempre visível */
html,body{height:100%;overflow:hidden}
.app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.app header{margin:0;flex:none}
.app .stage{flex:1 1 auto;min-height:0}
.app .stage svg{width:100%;height:100%}
.caption{flex:none;background:var(--card);border-radius:20px;padding:12px 14px;border:1px solid var(--line);box-shadow:0 4px 14px rgba(120,70,30,.08);min-height:84px}
.caption .you{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.caption .line{font-family:Fredoka,sans-serif;font-size:21px;font-weight:500;line-height:1.3;margin-top:2px;max-height:3.9em;overflow:auto}
.tl{color:var(--red);font-weight:700}
.caption .extra{margin-top:8px;font-size:15px;color:var(--ink);background:#FFF3D6;border-radius:10px;padding:8px 10px}
.capchips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.capchips .chip.alert{background:var(--yellow);border-color:var(--yellow);font-weight:700}
.capchips .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.app .controls{position:static;background:none;padding:0;flex:none}
.sheet{position:fixed;inset:0;background:rgba(40,25,15,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:16px}
.sheet .panel{width:100%;max-width:528px;max-height:88vh;overflow:auto;margin:0;position:relative}
.sheet .close{position:absolute;right:12px;top:12px}
.toast{bottom:120px}
</style>
</head>

<script type="module">
const WEBLLM_URL = "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.85/+esm";
let webllm = null;

const $ = id => document.getElementById(id);
let engine = null, history = [], busy = false, thinking = false;

/* ---------- Personalidade do Leeuwie ---------- */
const SCENES = {
  free: "Free conversation. You and the student are two friends sitting by a canal in Amsterdam.",
  bar: "Roleplay: you are the barista at a cozy brown café in Utrecht. The student orders coffee and Dutch snacks. Stay in the role, but you are still Leeuwie.",
  restaurant: "Roleplay: you are a waiter at a restaurant in Amsterdam. The student orders food, asks about dishes and pays. Sometimes a dish is sold out, so they must adapt.",
  meet: "Roleplay: you are a landlord in Rotterdam and the student wants to rent your apartment. Talk about rent, rooms, the neighborhood and dates.",
  travel: "Roleplay: the student just landed at Schiphol airport. You play the passport officer, then the hotel receptionist."
};
const LEVELS = {
  A1: "Student level A1 (absolute beginner). IMPORTANT: speak mainly in Brazilian Portuguese, like a teacher who explains, and teach Dutch little by little. Put EVERY Dutch word or phrase inside double square brackets, for example [[Hallo]]. Never put Portuguese inside the brackets. Each turn: teach or practice ONE short Dutch phrase (max 6 words), explain it briefly, then ask the student to say it or answer with it in Dutch. Keep your whole line short (max 3 sentences). In the TRADUCAO field write -.",
  A2: "Student level A2. Use short sentences (max 3), present, perfectum and simple future, with correct de/het articles. Common everyday vocabulary.",
  B1: "Student level B1. Natural conversational Dutch from the Netherlands, up to 4 sentences, any common tense, some idioms."
};
const HUMOR = {
  sweet: "Humor mode SWEET: playful and silly, light absurd jokes, NO swear words at all (only Lekker!, Doe normaal!, Wat een gedoe!).",
  spicy: "Humor mode SPICY: quick absurd humor and friendly teasing, occasional Dutch swear words (Shit!, Verdorie!, Kut!, Godverdomme!). About one per message, not always.",
  unhinged: "Humor mode UNHINGED: chaotic, unpredictable, absurd, frequent Dutch swear words (Godverdomme!, Kut!, Kutzooi!, Tering!). Over-the-top reactions to mistakes and to successes."
};

function systemPrompt(){
  const lv = $("level").value, hm = $("humor").value, sc = $("scene").value;
  return `You are LEEUWIE, a small golden cartoon lion from the Netherlands with an orange mane and a Dutch flag pin, living among tulip fields and windmills. You are a Dutch teacher inside a language app for adult Brazilian students.
Personality: spontaneous, unpredictable, playful and slightly chaotic. Your humor is absurd, fast and full of unexpected comments. You turn pronunciation mistakes into comic situations (especially the Dutch G and the diphthongs ui, ij, ou) and use Dutch cultural references.
${HUMOR[hm]}
Hard limits, in every mode: never insult the student's identity, appearance, origin, health or intelligence. Only make fun of the mistake or the situation. If the student asks you to calm down, do it.
${LEVELS[lv]}
Scene: ${SCENES[sc]}

Teaching rules:
- Unless the level says otherwise, speak Dutch from the Netherlands in your line.
- If the student's last message has a Dutch mistake, react in character, say the correct sentence in Dutch, and explain the mistake in ONE short sentence in Brazilian Portuguese in the DICA field.
- If there is no mistake, DICA is "-".
- If the student writes in Portuguese, answer in Dutch and teach how to say it in Dutch in DICA.
- Always end your Dutch line with ONE question to keep the conversation going.
- Never say you are an AI or mention any company or technology. You are Leeuwie.

Keep the entire answer under 40 words. Your spoken line must be at most TWO short sentences. Give only ONE simple question. Accuracy comes before jokes.
ANSWER FORMAT. Exactly three lines, nothing else:
LEEUWIE: <your line in Dutch>
TRADUCAO: <translation of your line into Brazilian Portuguese, or - if your line is already in Portuguese>
DICA: <short correction or tip in Brazilian Portuguese, or ->`;
}

/* ---------- Status e boca ---------- */
function setStatus(kind, text){
  $("status").className = "status " + (kind ? "st-" + kind : "");
  $("statusText").textContent = text;
  $("stage").classList.toggle("talking", kind === "talk");
}
let mouthTimer = null;
function mouth(on){
  $("mouthOpen").classList.toggle("hidden", !on);
  clearInterval(mouthTimer);
  if(!on) return;
  let t = 0;
  mouthTimer = setInterval(() => {
    t++;
    const open = (Math.sin(t*1.7) * .5 + .5) * (0.55 + Math.random()*.45);
    const ry = 3 + open * 22, rx = 30 + (1-open) * 14;
    $("mo").setAttribute("ry", ry.toFixed(1));
    $("mo").setAttribute("rx", rx.toFixed(1));
    $("tongue").setAttribute("cy", (848 + ry*0.55).toFixed(1));
    $("tongue").setAttribute("ry", Math.max(2, ry*0.35).toFixed(1));
    $("tongue").style.opacity = open > .35 ? 1 : 0;
  }, 85);
}

/* ---------- Voz do Leeuwie (voz gratuita do navegador) ---------- */
let voice = null;
/* Uma voz só por professor. De preferência uma voz "Multilingual" (Microsoft Edge),
   que fala português e o idioma ensinado com o mesmo timbre. Sem ela, usa a voz nativa para tudo. */
function nativeVoice(){
  const vs = speechSynthesis.getVoices().filter(v => /^nl/i.test(v.lang));
  return vs.find(v => /nl-NL/i.test(v.lang) && /google/i.test(v.name))
       || vs.find(v => /nl-NL/i.test(v.lang) && /(xander|frank|maarten|male|man)/i.test(v.name))
       || vs.find(v => /nl-NL/i.test(v.lang)) || vs[0] || null;
}
function bestVoice(lang){
  const base = lang.split("-")[0].toLowerCase();
  const vs = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().split("-")[0] === base);
  const score = v => (/natural|neural|online|premium|enhanced/i.test(v.name) ? 100 : 0)
    + (/google/i.test(v.name) ? 50 : 0) + (v.lang.toLowerCase() === lang.toLowerCase() ? 20 : 0);
  return vs.sort((a,b) => score(b) - score(a))[0] || null;
}
function pickVoice(){ voice = bestVoice("nl-NL") || nativeVoice(); }
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();

const SPEEDS = [0.85, 1.0, 1.15, 1.3, 1.5];
let speechRate = 1.0;
try{ const saved = parseFloat(localStorage.getItem("speechRate")); if(SPEEDS.includes(saved)) speechRate = saved; }catch(_){}
function showSpeed(){ $("speed").textContent = "Velocidade " + speechRate + "x"; }
showSpeed();
$("speed").onclick = () => {
  speechRate = SPEEDS[(SPEEDS.indexOf(speechRate) + 1) % SPEEDS.length];
  try{ localStorage.setItem("speechRate", speechRate); }catch(_){}
  showSpeed();
};
/* Texto com [[palavras no idioma]]: o português sai com voz brasileira e o idioma novo com voz nativa. */
function speechChunks(text){
  const out = [];
  const hasMarks = /\[\[/.test(text);
  text.split(/(\[\[[^\]]*\]\])/).forEach(seg => {
    if(!seg) return;
    const isTarget = /^\[\[/.test(seg);
    const clean = seg.replace(/^\[\[|\]\]$/g, "").trim();
    if(!clean) return;
    const pt = hasMarks && !isTarget;
    const parts = clean.match(/[^.!?¡¿]+[.!?]*|[¡¿][^.!?]+[.!?]*/g) || [clean];
    parts.map(p => p.trim()).filter(p => /[\p{L}\d]/u.test(p)).forEach(p => out.push({ text: p, pt }));
  });
  return out;
}
function plain(text){ return (text || "").replace(/\[\[|\]\]/g, ""); }
function richHTML(text){ return esc(text || "").replace(/\[\[(.*?)\]\]/g, '<span class="tl">$1</span>'); }
let speakId = 0;
function stopSpeaking(){ speakId++; speechSynthesis.cancel(); mouth(false); }
function speak(text){
  return new Promise(resolve => {
    const myId = ++speakId;
    speechSynthesis.cancel();
    const chunks = speechChunks(text);
    if(!chunks.length) return resolve();
    setStatus("talk", "Leeuwie falando");
    mouth(true);
    let i = 0;
    const finish = () => { mouth(false); setStatus("", "Sua vez"); resolve(); };
    const next = () => {
      if(myId !== speakId) return resolve();
      if(i >= chunks.length) return finish();
      const c = chunks[i++];
      const u = new SpeechSynthesisUtterance(c.text);
      const selectedVoice = c.pt ? bestVoice("pt-BR") : (bestVoice("nl-NL") || voice);
      u.lang = c.pt ? "pt-BR" : "nl-NL";
      if(selectedVoice) u.voice = selectedVoice;
      u.rate = speechRate; u.pitch = 1.0;
      let done = false;
      const go = () => { if(done) return; done = true; clearTimeout(guard); next(); };
      const guard = setTimeout(go, 2500 + u.text.length * 120);
      u.onend = go; u.onerror = go;
      speechSynthesis.resume();
      speechSynthesis.speak(u);
    };
    next();
  });
}

/* ---------- Ouvir o aluno (reconhecimento de voz do navegador) ---------- */
/* Aperta Falar para começar e Terminei para enviar. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, userStop = false, micFatal = false, heard = "", currentFinal = "";
/* Pede a permissão do microfone uma vez e solta o microfone na hora,
   para não disputar o microfone com o reconhecimento de voz. */
let micAllowed = false;
async function ensureMic(){
  if(micAllowed || !navigator.mediaDevices) return true;
  try{
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    st.getTracks().forEach(t => t.stop());
    micAllowed = true; return true;
  }catch(e){ toast(MIC_ERRORS["not-allowed"]); return false; }
}
let restarts = 0, stopGuard = null, restartTimer = null, finished = true;
let micSession = 0, micStarting = false;
const wait = ms => new Promise(r => setTimeout(r, ms));
function resetRecognition(){
  micSession++;
  clearTimeout(stopGuard); clearTimeout(restartTimer);
  const old = rec; rec = null;
  if(old){ old.onresult = old.onerror = old.onend = null; try{ old.abort(); }catch(_){} }
  listening = false; finished = true;
  heard = ""; currentFinal = "";
  $("mic").classList.remove("on"); $("micLabel").textContent = "Falar";
}
async function startListening(){
  if(micStarting || listening) return;
  if(!SR){ toast("Seu navegador não reconhece voz. Use o Google Chrome, ou escreva na caixa ao lado."); return; }
  if(busy || !engine){ toast("Espere um pouquinho, ainda estou pensando na resposta."); return; }
  micStarting = true;
  try{
    resetRecognition();
    const session = micSession;
    stopSpeaking(); hideToast();
    if(!(await ensureMic())) return;
    await wait(150);
    if(session !== micSession || busy) return;
    restarts = 0; finished = false; userStop = false; micFatal = false;
    $("typeIn").value = "";
    listening = true;
    if(!beginRecognition(session)) return;
    $("mic").classList.add("on"); $("micLabel").textContent = "Terminei";
    setStatus("listen", "Leeuwie ouvindo. Aperte Terminei quando acabar");
  }finally{ micStarting = false; }
}
function beginRecognition(session = micSession){
  const active = new SR(); rec = active;
  active.lang = $("level").value === "A1" ? "pt-BR" : "nl-NL";
  active.continuous = true; active.interimResults = true; active.maxAlternatives = 1;
  currentFinal = "";
  const valid = () => session === micSession && rec === active && !finished;
  active.onresult = e => {
    if(!valid()) return;
    let fin = "", interim = "";
    for(let i = 0; i < e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal) fin += r[0].transcript + " "; else interim += r[0].transcript;
    }
    currentFinal = fin.trim();
    $("typeIn").value = [heard, currentFinal, interim].filter(Boolean).join(" ").trim();
  };
  active.onerror = e => {
    if(!valid() || e.error === "no-speech" || e.error === "aborted") return;
    micFatal = true;
    toast(MIC_ERRORS[e.error] || ("O microfone deu erro (" + e.error + "). Você pode escrever na caixa ao lado."));
  };
  active.onend = () => {
    if(!valid()) return;
    heard = [heard, currentFinal].filter(Boolean).join(" ").trim(); currentFinal = "";
    if(listening && !userStop && !micFatal && restarts < 30){
      restarts++;
      restartTimer = setTimeout(() => {
        if(!valid()) return;
        if(listening && !userStop && !micFatal){ if(!beginRecognition(session)) finishListening(); }
        else finishListening();
      }, 250);
      return;
    }
    finishListening();
  };
  try{ active.start(); return true; }
  catch(e){ micFatal = true; toast("Não consegui ligar o microfone: " + e.message); finishListening(); return false; }
}
function finishListening(){
  if(finished) return;
  const t = ($("typeIn").value || "").trim();
  const shouldSend = listening && t && !micFatal;
  resetRecognition();
  $("typeIn").value = "";
  if(shouldSend) send(t);
  else if(!thinking) setStatus("", "Sua vez");
}
const MIC_ERRORS = {
  "not-allowed": "O navegador bloqueou o microfone. Clique no cadeado ao lado do endereço da página, permita o Microfone e aperte Falar de novo.",
  "service-not-allowed": "O navegador não deixou usar o reconhecimento de voz aqui. Abra a página no Google Chrome. Enquanto isso, escreva na caixa ao lado.",
  "audio-capture": "Não encontrei nenhum microfone. Confira se ele está conectado e liberado nas configurações do computador.",
  "network": "O reconhecimento de voz do Chrome precisa de internet e não conseguiu conectar. Se a página estiver aberta no app do Claude, abra no Google Chrome. Enquanto isso, escreva na caixa ao lado.",
  "no-speech": "Não ouvi nada. Aperte Falar e comece a falar logo em seguida, perto do microfone.",
  "language-not-supported": "Este navegador não reconhece fala neste idioma. Use o Google Chrome atualizado."
};
let toastTimer;
function toast(msg){ $("toast").textContent = msg; $("toast").classList.remove("hidden"); clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 9000); }
function hideToast(){ $("toast").classList.add("hidden"); }
$("mic").onclick = () => {
  if(!listening){ startListening(); return; }
  userStop = true;
  try{ rec.stop(); }catch(_){ finishListening(); return; }
  // Se o navegador não confirmar que parou, encerra assim mesmo.
  clearTimeout(stopGuard);
  stopGuard = setTimeout(() => { try{ rec.abort(); }catch(_){} finishListening(); }, 1500);
};
$("typeForm").onsubmit = e => {
  e.preventDefault();
  if(busy || !engine) return;
  const t = $("typeIn").value.trim();
  if(t){ resetRecognition(); $("typeIn").value = ""; send(t); }
};

/* ---------- Conversa ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
let current = { es: "", pt: "", tip: "" }, extraMode = "";
function addMe(text){
  const d = document.createElement("div"); d.className = "bubble me";
  d.innerHTML = `<div class="es">${esc(text)}</div>`;
  $("log").appendChild(d);
  $("you").textContent = "Você: " + text;
}
function showCaption(p){
  current = { es: p.es || "", pt: p.pt || "", tip: p.tip || "" };
  $("caption").classList.remove("hidden");
  $("line").innerHTML = richHTML(current.es);
  $("btnTr").disabled = !current.pt;
  $("btnTip").classList.toggle("hidden", !current.tip);
  if(extraMode === "pt" && current.pt) $("extra").textContent = current.pt;
  else if(extraMode === "tip" && current.tip) $("extra").textContent = current.tip;
  else setExtra("");
}
function setExtra(mode){
  extraMode = mode;
  const txt = mode === "pt" ? current.pt : mode === "tip" ? current.tip : "";
  $("extra").textContent = txt;
  $("extra").classList.toggle("hidden", !txt);
  $("btnTr").classList.toggle("active", mode === "pt");
  $("btnTip").classList.toggle("active", mode === "tip");
}
$("btnTr").onclick = () => setExtra(extraMode === "pt" ? "" : "pt");
$("btnTip").onclick = () => setExtra(extraMode === "tip" ? "" : "tip");
$("btnAgain").onclick = () => { if(current.es) speak(current.es); };
function addTeacher(p){
  const d = document.createElement("div"); d.className = "bubble";
  d.innerHTML = `<div class="es"></div><div class="pt"></div><div class="tip hidden"><b>Dica do Leeuwie:</b> <span></span></div>`;
  $("log").appendChild(d);
  extraMode = "";
  fillTeacher(d, p);
  return d;
}
function fillTeacher(d, p){
  d.dataset.es = p.es;
  d.querySelector(".es").innerHTML = richHTML(p.es);
  d.querySelector(".pt").textContent = p.pt || "";
  const tip = d.querySelector(".tip");
  tip.querySelector("span").textContent = p.tip || "";
  tip.classList.toggle("hidden", !p.tip);
  if(d === $("log").lastElementChild) showCaption(p);
}
function parse(raw){
  const clean = raw.replace(/\*\*/g, "");
  const get = k => { const m = clean.match(new RegExp(k + "\\s*:\\s*(.+)", "i")); return m ? m[1].trim() : ""; };
  let es = get("LEEUWIE"), pt = get("TRADU[CÇ][AÃ]O"), tip = get("DICA");
  es = es.replace(/\s*TRADU[CÇ][AÃ]O\s*:.*$/i, "").trim();
  if(!es) es = clean.split("\n").filter(l => !/^(TRADU|DICA)/i.test(l)).join(" ").trim();
  if(/^-+$/.test(tip)) tip = "";
  if(/^-+$/.test(pt)) pt = "";
  return { es, pt, tip };
}

/* Pede a resposta em partes: o professor começa a falar assim que a primeira linha fica pronta. */
const FIRST_LINE = new RegExp("LEEUWIE\\s*:\\s*([\\s\\S]+?)(?:\\n|TRADU[CÇ][AÃ]O\\s*:)", "i");
async function ask(messages, temperature){
  let raw = "", bubble = null, speaking = Promise.resolve();
  try{
  const stream = await engine.chat.completions.create({ messages, temperature, max_tokens: 96, stream: true });
  for await (const chunk of stream){
    raw += (chunk.choices[0] && chunk.choices[0].delta && chunk.choices[0].delta.content) || "";
    if(!bubble){
      const m = raw.match(FIRST_LINE);
      if(m && m[1].trim()){
        const es = m[1].trim();
        bubble = addTeacher({ es, pt: "", tip: "" });
        $("mic").disabled = true;
        speaking = speak(es);
      }
    }
  }
  }catch(e){
    $("mic").disabled = true;
    if(!bubble) throw new Error("a IA não conseguiu responder (" + e.message + ")");
    // A primeira frase já saiu: mantém o que chegou e segue a conversa.
  }
  if(!raw.trim()) throw new Error("a IA não retornou uma resposta. Abra Ajustes e tente acordar o professor com o cérebro Leve");
  const p = parse(raw);
  if(bubble){ p.es = bubble.dataset.es; fillTeacher(bubble, p); }
  else { addTeacher(p); $("mic").disabled = true; speaking = speak(p.es); }
  return { raw, speaking };
}

async function send(text){
  if(busy || !engine) return;
  resetRecognition();
  busy = true; thinking = true; $("mic").disabled = true;
  stopSpeaking();
  addMe(text);
  history.push({ role:"user", content:text });
  setStatus("think", "Leeuwie pensando");
  try{
    const msgs = [{ role:"system", content: systemPrompt() }, ...history.slice(-5)];
    const { raw, speaking } = await ask(msgs, 0.5);
    history.push({ role:"assistant", content: raw });
    speaking.catch(e => console.warn("[Wordly] voz", e));
  }catch(e){
    history.pop();
    toast("O Leeuwie engasgou: " + e.message);
    setStatus("", "Sua vez");
  }
  busy = false; thinking = false; $("mic").disabled = false;
}

function alertBox(msg){ $("err").textContent = msg; $("err").classList.remove("hidden"); $("setup").classList.remove("hidden"); }

/* ---------- Carregar o cérebro com plano B ----------
   Se a placa de vídeo não aceitar o formato escolhido (erro "exit(1)"), ou se um download
   antigo estiver corrompido, a página limpa o que foi salvo e tenta versões mais compatíveis. */
async function gpuSupportsF16(){
  try{ const a = await navigator.gpu.requestAdapter(); return !!(a && a.features && a.features.has("shader-f16")); }
  catch(_){ return false; }
}
function loadOnce(modelId, appConfig, label){
  let lastTick = Date.now();
  const STALL_MS = window.__STALL_MS || 90000;
  let watchdog;
  const stalled = new Promise((_, reject) => {
    watchdog = setInterval(() => {
      if(Date.now() - lastTick > STALL_MS) reject(new Error("o download parou de avançar por " + Math.round(STALL_MS/1000) + " segundos"));
    }, 2000);
  });
  const loading = webllm.CreateMLCEngine(modelId, {
    appConfig,
    initProgressCallback: p => {
      lastTick = Date.now();
      $("bar").style.width = Math.round((p.progress || 0) * 100) + "%";
      $("loadText").textContent = label + "Carregando o cérebro do Leeuwie: " + Math.round((p.progress||0)*100) + "%. Na primeira vez demora alguns minutos.";
    }
  }, { context_window_size: 2048 });
  return Promise.race([loading, stalled]).finally(() => clearInterval(watchdog));
}
async function loadBrain(chosen){
  const appConfig = { ...webllm.prebuiltAppConfig, cacheBackend: (typeof caches !== "undefined") ? "cache" : "indexeddb" };
  const f16 = await gpuSupportsF16();
  const f32 = id => id.replace("q4f16_1", "q4f32_1");
  const light = "Llama-3.2-1B-Instruct-" + (f16 ? "q4f16_1" : "q4f32_1") + "-MLC";
  const plan = [...new Set(f16 ? [chosen, light, f32(light)] : [f32(chosen), light])];
  const known = new Set((appConfig.model_list || []).map(m => m.model_id));
  let lastErr = null;
  for(let i = 0; i < plan.length; i++){
    const id = plan[i];
    if(known.size && !known.has(id)) continue;
    const label = i === 0 ? "" : "Tentando uma versão mais compatível (" + (i+1) + " de " + plan.length + "). ";
    try{ return await loadOnce(id, appConfig, label); }
    catch(e){
      lastErr = e;
      console.warn("[Wordly] falhou ao carregar", id, e);
      // limpa o que foi salvo desse cérebro, caso esteja corrompido
      try{ await webllm.deleteModelAllInfoInCache(id, appConfig); }catch(_){}
    }
  }
  throw lastErr || new Error("nenhum cérebro compatível com esta placa de vídeo");
}

/* ---------- Ligar o cérebro ---------- */
$("start").onclick = async () => {
  if(!navigator.gpu){
    alertBox("Este navegador não tem WebGPU, que é o que permite rodar a IA no seu computador. Abra esta página no Google Chrome ou no Microsoft Edge atualizados.");
    return;
  }
  $("start").disabled = true; $("barWrap").classList.remove("hidden"); $("err").classList.add("hidden");
  setStatus("think", "Acordando");
  if(!webllm){
    try{ webllm = await import(WEBLLM_URL); }
    catch(e){
      $("start").disabled = false;
      alertBox("Não consegui baixar a biblioteca de IA. Confira se o computador está conectado à internet e tente de novo. (" + e.message + ")");
      setStatus("", "Esperando");
      return;
    }
  }
  try{
    engine = await loadBrain($("model").value);
  }catch(e){
    $("start").disabled = false;
    const checks = [["Hugging Face (cérebro)", "https://huggingface.co/mlc-ai/Llama-3.2-1B-Instruct-q4f16_1-MLC/resolve/main/mlc-chat-config.json"],
                    ["GitHub (motor)", "https://raw.githubusercontent.com/mlc-ai/binary-mlc-llm-libs/main/README.md"]];
    const res = [];
    for(const [n,u] of checks){ try{ const r = await fetch(u, {cache:"no-store", signal: AbortSignal.timeout(8000)}); res.push(n + ": " + (r.ok ? "ok" : "erro " + r.status)); }catch(_){ res.push(n + ": BLOQUEADO"); } }
    const where = location.protocol === "file:" ? "arquivo aberto direto do computador" : location.host || "desconhecido";
    const blocked = res.some(r => r.includes("BLOQUEADO") || r.includes("erro"));
    const fix = blocked
      ? "COMO RESOLVER: abra este arquivo no Google Chrome (botão direito no arquivo, Abrir com, Google Chrome). Se já estiver no Chrome, a internet desta rede bloqueia o download: tente em outra rede, como a de casa ou o celular roteado."
      : /exit\(|GPU|WebGPU|device|adapter|memory/i.test(e.message)
        ? "COMO RESOLVER: a sua placa de vídeo não conseguiu rodar a IA, mesmo nas versões mais leves. Atualize o navegador e o driver de vídeo, feche outras abas pesadas e tente de novo. No Chrome, confira em chrome://gpu se o WebGPU aparece como ativado."
        : "COMO RESOLVER: a conexão está ok, então pode ter sido uma queda momentânea ou falta de espaço no disco. Clique em Acordar o Leeuwie de novo; se repetir, escolha o cérebro Leve.";
    alertBox(fix + " Detalhes: " + e.message + ". Teste de conexão: " + res.join(" | ") + ". Aberto em: " + where + " / " + (navigator.userAgent.match(/(Edg|Chrome|Electron|Firefox|Safari)\/[\d.]+/g)||[]).join(" "));
    setStatus("", "Esperando");
    return;
  }
  $("setup").classList.add("hidden");
  $("start").classList.add("hidden"); $("barWrap").classList.add("hidden");
  $("model").disabled = true;
  $("loadText").textContent = "Mudou nível, humor ou situação? O Leeuwie recomeça a conversa do zero.";
  $("settingsBtn").classList.remove("hidden"); $("historyBtn").classList.remove("hidden"); $("closeSetup").classList.remove("hidden");
  $("caption").classList.remove("hidden");
  $("controls").classList.remove("hidden");
  await greet();
};

async function greet(){
  history = []; $("log").innerHTML = ""; $("you").textContent = ""; $("line").textContent = ""; setExtra("");
  const opener = { A1: "Oi! Quero aprender neerlandês.", A2: "Hoi, hoe gaat het?", B1: "Hoi, hoe gaat het?" }[$("level").value];
  history.push({ role:"user", content: "(The student just opened the app. Greet them in character, introduce yourself in one sentence and start the scene.) " + opener });
  setStatus("think", "Leeuwie pensando");
  busy = true; thinking = true; $("mic").disabled = true;
  try{
    const { raw, speaking } = await ask([{ role:"system", content: systemPrompt() }, ...history], 0.5);
    history.push({ role:"assistant", content: raw });
    speaking.catch(e => console.warn("[Wordly] voz", e));
  }catch(e){ toast("O Leeuwie engasgou: " + e.message); }
  busy = false; thinking = false; $("mic").disabled = false;
  setStatus("", "Sua vez");
}

$("settingsBtn").onclick = () => $("setup").classList.toggle("hidden");
$("closeSetup").onclick = () => $("setup").classList.add("hidden");
$("historyBtn").onclick = () => { $("historySheet").classList.remove("hidden"); const l = $("log").lastElementChild; if(l) l.scrollIntoView({block:"end"}); };
$("closeHistory").onclick = () => $("historySheet").classList.add("hidden");
$("historySheet").onclick = e => { if(e.target.id === "historySheet") $("historySheet").classList.add("hidden"); };

/* Mudar humor, nível ou cena no meio recomeça a conversa */
["level","humor","scene"].forEach(id => $(id).onchange = () => { if(engine && !busy){ stopSpeaking(); greet(); } });
</script>
